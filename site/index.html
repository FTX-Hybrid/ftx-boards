<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FTX Group Boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --ground:#0B0B0C; --surface:#141416; --surface-2:#1B1B1E; --line:#2A2A2E; --line-soft:#212124;
    --ink:#F4F3F1; --ink-2:#B8B6B1; --ink-3:#78766F;
    --red:#D63027; --blue:#2E7DD1; --amber:#E0A82E;
    --good:#4FB06A; --warn:#E0A82E; --bad:#D63027; --accent:#D63027;
    --shadow:0 1px 0 rgba(0,0,0,.5), 0 14px 34px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ground); color:var(--ink); font-family:"Archivo",system-ui,sans-serif; -webkit-font-smoothing:antialiased}
  img{max-width:100%}[hidden]{display:none!important}
  .wrap{max-width:940px; margin:0 auto; padding:16px; padding-block:20px 64px}
  .tnum{font-variant-numeric:tabular-nums}
  .top{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:20px}
  .logo{font-family:"Oswald"; font-weight:700; font-size:22px; letter-spacing:.02em}
  .logo b{color:var(--red)}
  .creed{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
  .switch{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px}
  .sw{font-family:"Oswald"; font-weight:600; font-size:16px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2); background:var(--surface); border:1px solid var(--line); padding:10px 18px; border-radius:8px; cursor:pointer}
  .sw[aria-selected="true"]{color:#fff; background:var(--accent); border-color:transparent}
  .nameplate{position:relative; border:1px solid var(--line); border-left:5px solid var(--accent); background:linear-gradient(100deg,var(--surface),var(--surface-2)); border-radius:14px; padding:22px 24px; margin-bottom:18px; overflow:hidden; box-shadow:var(--shadow)}
  .nameplate .eyebrow{font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .nameplate h1{font-family:"Oswald"; font-weight:700; font-size:clamp(40px,10vw,74px); line-height:.9; margin:6px 0 2px; letter-spacing:.01em; text-transform:uppercase}
  .nameplate .tag{color:var(--ink-2); font-size:14px}
  .nameplate .ghost{position:absolute; right:14px; top:-14px; font-family:"Oswald"; font-weight:700; font-size:150px; line-height:1; color:var(--accent); opacity:.06; pointer-events:none}
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:8px}
  @media (max-width:620px){ .kpis{grid-template-columns:1fr 1fr} }
  .kpi{background:var(--surface); border:1px solid var(--line-soft); border-radius:11px; padding:13px 15px; box-shadow:var(--shadow)}
  .kpi .l{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
  .kpi .v{font-family:"Oswald"; font-weight:700; font-size:27px; margin-top:3px}
  .kpi .v small{font-size:14px; color:var(--ink-3); font-family:"Archivo"; font-weight:600}
  .kpi.hi .v{color:var(--accent)}
  .callout{display:flex; align-items:center; gap:12px; background:linear-gradient(100deg,color-mix(in oklab,var(--accent) 16%,var(--surface)),var(--surface)); border:1px solid color-mix(in oklab,var(--accent) 35%,var(--line)); border-radius:11px; padding:12px 16px; margin:14px 0 4px; font-size:14px}
  .callout b{font-family:"Oswald"; font-weight:700; font-size:18px}
  .callout .em{color:var(--accent)}
  .sechead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:22px 2px 8px}
  .sechead h2{font-family:"Oswald"; font-weight:600; font-size:18px; text-transform:uppercase; letter-spacing:.04em; margin:0}
  .sechead .cap{font-size:12px; color:var(--ink-3)}
  .tap{font-size:12px; color:var(--ink-3); margin:0 2px 12px}
  .board{display:flex; flex-direction:column; gap:7px}
  .item{background:var(--surface); border:1px solid var(--line-soft); border-radius:11px; box-shadow:var(--shadow); overflow:hidden}
  .item.lead{border-color:color-mix(in oklab,var(--accent) 55%,var(--line))}
  .row{list-style:none; cursor:pointer; display:grid; grid-template-columns:34px 1fr auto auto 16px; align-items:center; gap:13px; padding:11px 15px}
  .row::-webkit-details-marker{display:none}
  @media (max-width:620px){ .row{grid-template-columns:28px 1fr auto 16px; gap:10px} .row .career{display:none} }
  .rk{font-family:"Oswald"; font-weight:700; font-size:18px; color:var(--ink-3); text-align:center}
  .item.lead .rk{color:var(--accent)}
  .nm{font-weight:700; font-size:15.5px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .pill{font-size:10px; letter-spacing:.06em; text-transform:uppercase; font-weight:800; padding:2px 8px; border-radius:5px}
  .pill.strk{background:#2a1607; color:#ff9d3c; letter-spacing:.02em}
  .splitrow .dt{opacity:.55; font-weight:600}
  .p-strong{color:var(--good); border:1px solid color-mix(in oklab,var(--good) 45%,transparent)}
  .p-solid{color:var(--blue); border:1px solid color-mix(in oklab,var(--blue) 45%,transparent)}
  .p-slip{color:var(--warn); border:1px solid color-mix(in oklab,var(--warn) 45%,transparent)}
  .p-ghost{color:var(--bad); border:1px solid color-mix(in oklab,var(--bad) 45%,transparent)}
  .wk{font-family:"Oswald"; font-weight:700; font-size:20px; text-align:right}
  .wk small{font-size:10.5px; color:var(--ink-3); font-family:"Archivo"; font-weight:600}
  .career{font-size:11.5px; color:var(--ink-3); text-align:right; min-width:74px}
  .career b{color:var(--ink-2); font-weight:700}
  .chev{color:var(--ink-3); font-size:11px; justify-self:end; transition:transform .2s}
  details[open] .chev{transform:rotate(180deg)}
  @media (prefers-reduced-motion:reduce){.chev{transition:none}}
  .item.zero .wk{color:var(--bad)}
  .detail{padding:2px 16px 15px 56px}
  @media (max-width:620px){ .detail{padding-left:16px} }
  .dh{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); font-weight:800; margin:4px 0 2px}
  .splitrow{display:grid; grid-template-columns:1fr auto; gap:12px; font-size:13.5px; padding:8px 0; border-top:1px solid var(--line-soft)}
  .splitrow .vv{font-variant-numeric:tabular-nums; font-weight:700}
  .pend{font-size:13px; color:var(--ink-3); padding:9px 0 2px; border-top:1px solid var(--line-soft); line-height:1.5}
  .pend em{color:var(--ink-2); font-style:normal}
  .chase{background:color-mix(in oklab,var(--bad) 9%,var(--surface)); border:1px solid color-mix(in oklab,var(--bad) 32%,var(--line)); border-radius:12px; padding:15px 16px; margin-top:16px}
  .chase h3{font-family:"Oswald"; font-weight:600; text-transform:uppercase; letter-spacing:.03em; font-size:16px; margin:0 0 4px; color:var(--bad)}
  .chase p{margin:0 0 9px; font-size:13px; color:var(--ink-2); line-height:1.5}
  .chips{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
  .chip{font-size:12.5px; font-weight:600; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px 11px}
  .chip .z{color:var(--bad); font-weight:800} .chip .s{color:var(--warn); font-weight:800}
  .more{font-size:12px; color:var(--ink-3)}
  footer{margin-top:34px; border-top:1px solid var(--line); padding-top:16px; color:var(--ink-3); font-size:12.5px; line-height:1.6}
  footer b{color:var(--ink-2)}
  .hard{font-family:"Oswald"; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); font-size:14px; margin-top:10px}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="logo"><b>FTX</b> HYBRID ATHLETICS</div>
    <div class="creed">1% Better Every Day</div>
  </div>
  <div class="switch" role="tablist" id="switch"></div>
  <div id="panel"></div>
  <footer>
    <b>Real data</b> — pulled from the FTX account nightly. Career totals are lifetime logged workouts.
    <br><b>Reading it:</b> <span style="color:var(--good)">Strong</span> 20+ · <span style="color:var(--blue)">Solid</span> 10–19 · <span style="color:var(--warn)">Slipping</span> 1–9 · <span style="color:var(--bad)">Not logging</span> 0.
    <div class="hard">Nobody cares. Work harder.</div>
  </footer>
</div>
<script>
const META = {
  ATHENA:      { accent:'var(--amber)', tag:"Women's HYROX — Wisdom · Strategy · Discipline · Mastery" },
  MAVERICK:    { accent:'var(--red)',   tag:"Men's invitation-only" },
  HYROX:       { accent:'var(--blue)',  tag:"HYROX race program" },
  HYROXONLINE: { accent:'#2CA6B8', label:'Hyrox Online', tag:"Online HYROX coaching" },
  HYBRID:      { accent:'linear-gradient(90deg,var(--red),var(--blue))', accentSolid:'var(--blue)', tag:"Hybrid strength + engine track" }
};
const ORDER = ['ATHENA','MAVERICK','HYROX','HYROXONLINE','HYBRID'];
const label = g => (META[g] && META[g].label) ? META[g].label : g;
const cache = {};
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function statusOf(w){ if(w===0) return ['Not logging','p-ghost']; if(w<10) return ['Slipping','p-slip']; if(w<20) return ['Solid','p-solid']; return ['Strong','p-strong']; }

const swEl = document.getElementById('switch'), panel = document.getElementById('panel');
ORDER.forEach((g,i)=>{ const b=document.createElement('button'); b.className='sw'; b.type='button'; b.setAttribute('role','tab'); b.textContent=label(g); b.setAttribute('aria-selected',i===0?'true':'false'); b.onclick=()=>show(g); swEl.appendChild(b); });

async function load(g){ if(cache[g]) return cache[g]; if(window.__DATA__&&window.__DATA__[g]){ cache[g]=window.__DATA__[g]; return cache[g]; } const r=await fetch('data/'+g+'.json',{cache:'no-store'}); cache[g]=await r.json(); return cache[g]; }
// Single-group mode: ?g=athena shows only that group (no switcher) — the per-group link.
const only = (new URLSearchParams(location.search).get('g')||'').toUpperCase().replace(/[^A-Z]/g,'');
async function show(g){
  const meta=META[g]; document.documentElement.style.setProperty('--accent', meta.accent);
  [...swEl.children].forEach((b,i)=>{ const on=ORDER[i]===g; b.setAttribute('aria-selected',on?'true':'false'); b.style.background=on?(meta.accentSolid||meta.accent):''; });
  panel.innerHTML='<div class="pend" style="border:0">Loading '+g+'…</div>';
  let d; try{ d=await load(g); }catch(e){ panel.innerHTML='<div class="chase"><h3>Data not found</h3><p>Could not load data/'+g+'.json.</p></div>'; return; }
  render(g, meta, d);
}
function render(g, meta, d){
  const active=d.members.filter(m=>m.w>0), slip=d.members.filter(m=>m.w>0&&m.w<10);
  const zeros=d.total-active.length, rate=Math.round(active.length/d.total*100), totalW=d.members.reduce((s,m)=>s+m.w,0), top=active[0];
  const NM=label(g);
  let h=`<div class="nameplate"><div class="ghost">${NM[0]}</div><div class="eyebrow">FTX · ${d.total} members · ${esc(d.window||'')}</div><h1>${esc(NM)}</h1><div class="tag">${esc(meta.tag)}</div></div>`;
  h+='<div class="kpis">'
    +`<div class="kpi hi"><div class="l">Logging</div><div class="v tnum">${active.length}<small> / ${d.total}</small></div></div>`
    +`<div class="kpi hi"><div class="l">Engagement</div><div class="v tnum">${rate}<small>%</small></div></div>`
    +`<div class="kpi"><div class="l">Workouts 30d</div><div class="v tnum">${totalW}</div></div>`
    +`<div class="kpi"><div class="l">Leader</div><div class="v tnum">${top?top.w:0}<small> ${top?esc(top.n.split(' ')[0]):''}</small></div></div>`
    +'</div>';
  if(top) h+=`<div class="callout"><b class="em">${esc(top.n)}</b><span>tops ${esc(NM)} — <b>${top.w}</b> workouts this month${top.c?` · <b>${top.c}</b> career`:''}.</span></div>`;
  h+=`<div class="sechead"><h2>${esc(NM)} Board</h2><div class="cap">ranked · last 30 days</div></div><p class="tap">Tap an athlete for detail ▾</p><div class="board">`;
  active.forEach((m,i)=>{ const [lbl,cls]=statusOf(m.w); const lead=i===0?' lead':'';
    const strk = (m.streak&&m.streak>1)?` <span class="pill strk">🔥 ${m.streak}</span>`:'';
    h+=`<details class="item${lead}"><summary class="row"><div class="rk">${i+1}</div><div class="nm">${esc(m.n)} <span class="pill ${cls}">${lbl}</span>${strk}</div><div class="wk tnum">${m.w} <small>WK</small></div><div class="career tnum">${m.c?`<b>${m.c}</b> career`:''}</div><span class="chev">▾</span></summary><div class="detail">`;
    if(m.detail&&m.detail.moves){ h+=`<div class="dh">${esc(m.detail.title||'Last session')}${m.detail.date?` · <span class="dt">${esc(m.detail.date)}</span>`:''}</div>`;
      m.detail.moves.forEach(mv=>{ const r=[]; if(mv.reps) r.push(`${mv.reps} reps`); if(mv.weight) r.push(`${mv.weight.toLocaleString()} lb`); if(mv.time) r.push(`${mv.time}s`); h+=`<div class="splitrow"><span>${esc(mv.name)}</span><span class="vv">${esc(r.join(' · ')||'logged')}</span></div>`; });
      if(m.prs&&m.prs.length){ h+=`<div class="dh" style="margin-top:10px">Personal bests</div>`; m.prs.slice(0,5).forEach(p=>{ const v=p.weight?`${p.weight.toLocaleString()} lb`:`${p.reps} reps`; h+=`<div class="splitrow"><span>🏆 ${esc(p.name)}</span><span class="vv">${esc(v)}<small style="opacity:.6"> · ${esc(p.date)}</small></span></div>`; }); }
    }
    else h+=`<div class="pend"><em>No logged session yet in this window.</em> Detail appears here after their next logged workout.</div>`;
    h+='</div></details>';
  });
  h+='</div>';
  const namedZeros = (d.zerosNamed&&d.zerosNamed.length)?d.zerosNamed:d.members.filter(m=>m.w===0).map(m=>m.n);
  h+=`<div class="chase"><h3>Chase list — ${slip.length+zeros} need a nudge</h3><p>${zeros} logged nothing in 30 days${slip.length?`, ${slip.length} slipping (under 10)`:''}. Start here.</p><div class="chips">`;
  slip.forEach(m=>{ h+=`<span class="chip"><span class="s">${m.w}</span> · ${esc(m.n)}</span>`; });
  namedZeros.slice(0,8).forEach(n=>{ h+=`<span class="chip"><span class="z">0</span> · ${esc(n)}</span>`; });
  const shown=Math.min(namedZeros.length,8); if(zeros>shown) h+=`<span class="more">+${zeros-shown} more not logging</span>`;
  h+='</div>'; panel.innerHTML=h;
}
if (only && ORDER.includes(only)) { swEl.hidden = true; show(only); } else { show('ATHENA'); }
</script></body></html>
