<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --ground:#0B0B0C; --surface:#141416; --surface-2:#1B1B1E; --line:#2A2A2E; --line-soft:#212124;
    --ink:#F4F3F1; --ink-2:#B8B6B1; --ink-3:#78766F;
    --red:#D63027; --blue:#2E7DD1; --amber:#E0A82E;
    --good:#4FB06A; --warn:#E0A82E; --bad:#D63027; --accent:#D63027;
    --shadow:0 1px 0 rgba(0,0,0,.5), 0 14px 34px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ground); color:var(--ink); font-family:"Archivo",system-ui,sans-serif; -webkit-font-smoothing:antialiased}
  img{max-width:100%}[hidden]{display:none!important}
  .wrap{max-width:940px; margin:0 auto; padding:16px; padding-block:20px 64px}
  .tnum{font-variant-numeric:tabular-nums}
  .top{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:20px}
  .logo{font-family:"Oswald"; font-weight:700; font-size:22px; letter-spacing:.02em}
  .logo b{color:var(--red)}
  .creed{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
  .switch{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px}
  .sw{font-family:"Oswald"; font-weight:600; font-size:16px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2); background:var(--surface); border:1px solid var(--line); padding:10px 18px; border-radius:8px; cursor:pointer}
  .sw[aria-selected="true"]{color:#fff; background:var(--accent); border-color:transparent}
  .nameplate{position:relative; border:1px solid var(--line); border-left:5px solid var(--accent); background:linear-gradient(100deg,var(--surface),var(--surface-2)); border-radius:14px; padding:22px 24px; margin-bottom:18px; overflow:hidden; box-shadow:var(--shadow)}
  .nameplate .eyebrow{font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--accent); font-weight:800}
  .nameplate h1{font-family:"Oswald"; font-weight:700; font-size:clamp(40px,10vw,74px); line-height:.9; margin:6px 0 2px; letter-spacing:.01em; text-transform:uppercase}
  .nameplate .tag{color:var(--ink-2); font-size:14px}
  .nameplate .ghost{position:absolute; right:14px; top:-14px; font-family:"Oswald"; font-weight:700; font-size:150px; line-height:1; color:var(--accent); opacity:.06; pointer-events:none}
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:8px}
  @media (max-width:620px){ .kpis{grid-template-columns:1fr 1fr} }
  .kpi{background:var(--surface); border:1px solid var(--line-soft); border-radius:11px; padding:13px 15px; box-shadow:var(--shadow)}
  .kpi .l{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
  .kpi .v{font-family:"Oswald"; font-weight:700; font-size:27px; margin-top:3px}
  .kpi .v small{font-size:14px; color:var(--ink-3); font-family:"Archivo"; font-weight:600}
  .kpi.hi .v{color:var(--accent)}
  .callout{display:flex; align-items:center; gap:12px; background:linear-gradient(100deg,color-mix(in oklab,var(--accent) 16%,var(--surface)),var(--surface)); border:1px solid color-mix(in oklab,var(--accent) 35%,var(--line)); border-radius:11px; padding:12px 16px; margin:14px 0 4px; font-size:14px}
  .callout b{font-family:"Oswald"; font-weight:700; font-size:18px}
  .callout .em{color:var(--accent)}
  .sechead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:22px 2px 8px}
  .sechead h2{font-family:"Oswald"; font-weight:600; font-size:18px; text-transform:uppercase; letter-spacing:.04em; margin:0}
  .sechead .cap{font-size:12px; color:var(--ink-3)}
  .tap{font-size:12px; color:var(--ink-3); margin:0 2px 12px}
  .board{display:flex; flex-direction:column; gap:7px}
  .item{background:var(--surface); border:1px solid var(--line-soft); border-radius:11px; box-shadow:var(--shadow); overflow:hidden}
  .item.lead{border-color:color-mix(in oklab,var(--accent) 55%,var(--line))}
  .row{list-style:none; cursor:pointer; display:grid; grid-template-columns:34px 1fr auto auto 16px; align-items:center; gap:13px; padding:11px 15px}
  .row::-webkit-details-marker{display:none}
  @media (max-width:620px){ .row{grid-template-columns:28px 1fr auto 16px; gap:10px} .row .career{display:none} }
  .rk{font-family:"Oswald"; font-weight:700; font-size:18px; color:var(--ink-3); text-align:center}
  .item.lead .rk{color:var(--accent)}
  .nm{font-weight:700; font-size:15.5px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .pill{font-size:10px; letter-spacing:.06em; text-transform:uppercase; font-weight:800; padding:2px 8px; border-radius:5px}
  .pill.strk{background:#2a1607; color:#ff9d3c; letter-spacing:.02em}
  .splitrow .dt{opacity:.55; font-weight:600}
  .p-strong{color:var(--good); border:1px solid color-mix(in oklab,var(--good) 45%,transparent)}
  .p-solid{color:var(--blue); border:1px solid color-mix(in oklab,var(--blue) 45%,transparent)}
  .p-slip{color:var(--warn); border:1px solid color-mix(in oklab,var(--warn) 45%,transparent)}
  .p-ghost{color:var(--bad); border:1px solid color-mix(in oklab,var(--bad) 45%,transparent)}
  .wk{font-family:"Oswald"; font-weight:700; font-size:20px; text-align:right}
  .wk small{font-size:10.5px; color:var(--ink-3); font-family:"Archivo"; font-weight:600}
  .career{font-size:11.5px; color:var(--ink-3); text-align:right; min-width:74px}
  .career b{color:var(--ink-2); font-weight:700}
  .chev{color:var(--ink-3); font-size:11px; justify-self:end; transition:transform .2s}
  details[open] .chev{transform:rotate(180deg)}
  @media (prefers-reduced-motion:reduce){.chev{transition:none}}
  .item.zero .wk{color:var(--bad)}
  .detail{padding:2px 16px 16px 56px}
  @media (max-width:620px){ .detail{padding-left:16px} }
  .dh{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); font-weight:800; margin:12px 0 4px}
  .dh2{font-size:12px; font-weight:800; color:var(--ink-2); margin:2px 0 4px}
  .splitrow{display:grid; grid-template-columns:1fr auto; gap:12px; font-size:13.5px; padding:7px 0; border-top:1px solid var(--line-soft)}
  .splitrow .vv{font-variant-numeric:tabular-nums; font-weight:700}
  .pend{font-size:13px; color:var(--ink-3); padding:9px 0 2px; border-top:1px solid var(--line-soft); line-height:1.5}
  .pend em{color:var(--ink-2); font-style:normal}
  /* profile */
  .pstrip{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:6px 0 2px}
  @media (max-width:620px){ .pstrip{grid-template-columns:1fr 1fr} }
  .pstat{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:9px; padding:9px 11px}
  .pstat .pl{font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
  .pstat .pv{font-family:"Oswald"; font-weight:700; font-size:22px; margin-top:2px}
  .pcols{display:grid; grid-template-columns:1fr 1fr; gap:18px}
  @media (max-width:620px){ .pcols{grid-template-columns:1fr; gap:2px} }
  .psel{width:100%; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; font-size:13px; margin:2px 0 8px}
  .pchart .spark{width:100%; height:auto; display:block; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:9px; padding:4px}
  .spark path{stroke-linejoin:round; stroke-linecap:round}
  .spark circle{fill:var(--c)}
  .spark .axl{fill:var(--ink-3); font-size:8px; font-family:"Archivo"}
  .prange{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-3); margin-top:5px}
  .prange span:first-child{color:var(--ink-2); font-weight:700; font-variant-numeric:tabular-nums}
  .pday{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:9px; padding:4px 12px 10px}
  .chase{background:color-mix(in oklab,var(--bad) 9%,var(--surface)); border:1px solid color-mix(in oklab,var(--bad) 32%,var(--line)); border-radius:12px; padding:15px 16px; margin-top:16px}
  .chase h3{font-family:"Oswald"; font-weight:600; text-transform:uppercase; letter-spacing:.03em; font-size:16px; margin:0 0 4px; color:var(--bad)}
  .chase p{margin:0 0 9px; font-size:13px; color:var(--ink-2); line-height:1.5}
  .chips{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
  .chip{font-size:12.5px; font-weight:600; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px 11px}
  .chip .z{color:var(--bad); font-weight:800} .chip .s{color:var(--warn); font-weight:800}
  .more{font-size:12px; color:var(--ink-3)}
  footer{margin-top:34px; border-top:1px solid var(--line); padding-top:16px; color:var(--ink-3); font-size:12.5px; line-height:1.6}
  footer b{color:var(--ink-2)}
  .hard{font-family:"Oswald"; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); font-size:14px; margin-top:10px}

d":1014447,"reps":0,"weight":0,"time":0},{"name":"Cool Down","id":1014471,"reps":0,"weight":0,"time":0}]},"hist":[{"date":"2026-04-07","title":"Hyrox 4|7 - Track Day","moves":[{"name":"Warm Up","id":1011784,"reps":0,"weight":0,"time":0},{"name":"Hyrox Running","id":1011785,"reps":0,"weight":0,"time":2022},{"name":"Worlds Work","id":1014447,"reps":0,"weight":0,"time":0},{"name":"Cool Down","id":1014471,"reps":0,"weight":0,"time":0}]},{"date":"2026-02-22","title":"2/22/2026","moves":[{"name":"Running","id":993286,"reps":0,"weight":0,"time":5700}]},{"date":"2026-02-22","title":"2/22/2026","moves":[{"name":"Running","id":993286,"reps":0,"weight":0,"time":5700}]}],"c":43},{"n":"Talon Smith","w":1,"h":"—","streak":0,"detail":{"date":"2026-01-07","title":"Week 6 Day 2","moves":[{"name":"Warm Up","id":1011784,"reps":0,"weight":0,"time":0},{"name":"Running","id":993286,"reps":0,"weight":0,"time":0}]},"hist":[{"date":"2026-01-07","title":"Week 6 Day 2","moves":[{"name":"Warm Up","id":1011784,"reps":0,"weight":0,"time":0},{"name":"Running","id":993286,"reps":0,"weight":0,"time":0}]},{"date":"2026-01-07","title":"Week 6 Day 2","moves":[{"name":"Warm Up","id":1011784,"reps":0,"weight":0,"time":0},{"name":"Running","id":993286,"reps":0,"weight":0,"time":0},{"name":"Worlds Work","id":1014447,"reps":0,"weight":0,"time":0},{"name":"Cool Down","id":1014471,"reps":0,"weight":0,"time":0}]}],"c":43},{"n":"Jaci Caceres","w":0,"h":"—","streak":0,"c":2},{"n":"Andrew Pour","w":0,"h":"—","streak":0},{"n":"Francheska Duffey","w":0,"h":"—","streak":0},{"n":"Danielle Rueter","w":0,"h":"—","streak":0,"c":21},{"n":"Shonna Andersen","w":0,"h":"—","streak":0,"c":10},{"n":"Martha Samaniego","w":0,"h":"—","streak":0,"c":27},{"n":"Eva Martinez","w":0,"h":"—","streak":0,"c":4}],"zerosNamed":["Jaci Caceres","Andrew Pour","Francheska Duffey","Danielle Rueter","Shonna Andersen","Martha Samaniego","Eva Martinez"]}};</script>

<div class="wrap">
  <div class="top">
    <div class="logo"><b>FTX</b> HYBRID ATHLETICS</div>
    <div class="creed">1% Better Every Day</div>
  </div>
  <div class="switch" role="tablist" id="switch"></div>
  <div id="panel"></div>
  <footer>
    <b>Real data</b> — pulled from the FTX account nightly, every logged workout since Jan 1, 2026. A "workout" is one full training day. Tap any name for lifts, runs, streaks and trends.
    <div class="hard">Nobody cares. Work harder.</div>
  </footer>
</div>
<script>
const META = {
  ATHENA:      { accent:'var(--amber)', tag:"Women's HYROX — Wisdom · Strategy · Discipline · Mastery" },
  MAVERICK:    { accent:'var(--red)',   tag:"Men's invitation-only" },
  HYROX:       { accent:'var(--blue)',  tag:"HYROX race program" },
  HYROXONLINE: { accent:'#2CA6B8', label:'Hyrox Online', tag:"Online HYROX coaching" },
  HYBRID:      { accent:'linear-gradient(90deg,var(--red),var(--blue))', accentSolid:'var(--blue)', tag:"Hybrid strength + engine track" }
};
const ORDER = ['ATHENA','MAVERICK','HYROX','HYROXONLINE','HYBRID'];
const label = g => (META[g] && META[g].label) ? META[g].label : g;
const cache = {};
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function statusOf(w){ if(w===0) return ['Not logging','p-ghost']; if(w<20) return ['Slipping','p-slip']; if(w<60) return ['Solid','p-solid']; return ['Strong','p-strong']; }
const RUN_RE = /\brun\b|running|\d+\s?k?m\s*run|\d+\s?m\s*run|\bski\b|\brow\b|\berg\b/i;
function fmtTime(s){ s=Math.round(s); const m=Math.floor(s/60), r=s%60; return m ? m+':'+String(r).padStart(2,'0') : s+'s'; }

const swEl = document.getElementById('switch'), panel = document.getElementById('panel');
ORDER.forEach((g,i)=>{ const b=document.createElement('button'); b.className='sw'; b.type='button'; b.setAttribute('role','tab'); b.textContent=label(g); b.setAttribute('aria-selected',i===0?'true':'false'); b.onclick=()=>show(g); swEl.appendChild(b); });

async function load(g){ if(cache[g]) return cache[g]; if(window.__DATA__&&window.__DATA__[g]){ cache[g]=window.__DATA__[g]; return cache[g]; } const r=await fetch('data/'+g+'.json',{cache:'no-store'}); cache[g]=await r.json(); return cache[g]; }
// Single-group mode: ?g=athena shows only that group (no switcher) — the per-group link.
const only = (window.__ONLY__ || new URLSearchParams(location.search).get('g') || '').toUpperCase().replace(/[^A-Z]/g,'');
async function show(g){
  const meta=META[g]; document.documentElement.style.setProperty('--accent', meta.accent);
  [...swEl.children].forEach((b,i)=>{ const on=ORDER[i]===g; b.setAttribute('aria-selected',on?'true':'false'); b.style.background=on?(meta.accentSolid||meta.accent):''; });
  panel.innerHTML='<div class="pend" style="border:0">Loading '+g+'…</div>';
  let d; try{ d=await load(g); }catch(e){ panel.innerHTML='<div class="chase"><h3>Data not found</h3><p>Could not load data/'+g+'.json.</p></div>'; return; }
  render(g, meta, d);
}

let VIEW = [];   // members currently rendered (aligned to data-idx)

function render(g, meta, d){
  const active=d.members.filter(m=>m.w>0), slip=d.members.filter(m=>m.w>0&&m.w<20);
  const zeros=d.total-active.length, rate=d.total?Math.round(active.length/d.total*100):0, totalW=d.members.reduce((s,m)=>s+m.w,0), top=active[0];
  const NM=label(g); VIEW=active;
  let h=`<div class="nameplate"><div class="ghost">${NM[0]}</div><div class="eyebrow">FTX · ${d.total} members · ${esc(d.window||'')}</div><h1>${esc(NM)}</h1><div class="tag">${esc(meta.tag)}</div></div>`;
  h+='<div class="kpis">'
    +`<div class="kpi hi"><div class="l">Logging</div><div class="v tnum">${active.length}<small> / ${d.total}</small></div></div>`
    +`<div class="kpi hi"><div class="l">Engagement</div><div class="v tnum">${rate}<small>%</small></div></div>`
    +`<div class="kpi"><div class="l">Days trained</div><div class="v tnum">${totalW}</div></div>`
    +`<div class="kpi"><div class="l">Leader</div><div class="v tnum">${top?top.w:0}<small> ${top?esc(top.n.split(' ')[0]):''}</small></div></div>`
    +'</div>';
  if(top) h+=`<div class="callout"><b class="em">${esc(top.n)}</b><span>tops ${esc(NM)} — <b>${top.w}</b> training days${top.c?` · <b>${top.c}</b> career`:''}.</span></div>`;
  h+=`<div class="sechead"><h2>${esc(NM)} Board</h2><div class="cap">ranked · ${esc(d.window||'')}</div></div><p class="tap">Tap an athlete for their profile ▾</p><div class="board">`;
  active.forEach((m,i)=>{ const [lbl,cls]=statusOf(m.w); const lead=i===0?' lead':'';
    const strk = (m.streak&&m.streak>1)?` <span class="pill strk">🔥 ${m.streak}</span>`:'';
    h+=`<details class="item${lead}" data-idx="${i}"><summary class="row"><div class="rk">${i+1}</div><div class="nm">${esc(m.n)} <span class="pill ${cls}">${lbl}</span>${strk}</div><div class="wk tnum">${m.w} <small>DAYS</small></div><div class="career tnum">${m.c?`<b>${m.c}</b> career`:''}</div><span class="chev">▾</span></summary><div class="detail"><div class="pend" style="border:0">Opening profile…</div></div></details>`;
  });
  h+='</div>';
  const namedZeros = (d.zerosNamed&&d.zerosNamed.length)?d.zerosNamed:d.members.filter(m=>m.w===0).map(m=>m.n);
  h+=`<div class="chase"><h3>Chase list — ${slip.length+zeros} need a nudge</h3><p>${zeros} haven't logged a workout${slip.length?`, ${slip.length} slipping (under 20 days)`:''}. Start here.</p><div class="chips">`;
  slip.forEach(m=>{ h+=`<span class="chip"><span class="s">${m.w}</span> · ${esc(m.n)}</span>`; });
  namedZeros.slice(0,8).forEach(n=>{ h+=`<span class="chip"><span class="z">0</span> · ${esc(n)}</span>`; });
  const shown=Math.min(namedZeros.length,8); if(zeros>shown) h+=`<span class="more">+${zeros-shown} more not logging</span>`;
  h+='</div>'; panel.innerHTML=h;
  // lazy-build each profile the first time its row is opened
  panel.querySelectorAll('details.item').forEach(det=>{
    det.addEventListener('toggle', ()=>{ if(det.open && !det.dataset.built){ det.dataset.built='1'; buildProfile(det.querySelector('.detail'), VIEW[+det.dataset.idx]); } });
  });
}

// ---- profile ----
function topLifts(hist){
  const best={};
  hist.forEach(s=>s.moves.forEach(mv=>{ if(mv.weight>0 && !RUN_RE.test(mv.name)){ const k=mv.name; if(!best[k]||mv.weight>best[k].weight) best[k]={name:mv.name,weight:mv.weight,date:s.date}; } }));
  return Object.values(best).sort((a,b)=>b.weight-a.weight).slice(0,6);
}
function fastRuns(hist){
  const best={};
  hist.forEach(s=>s.moves.forEach(mv=>{ if(mv.time>0 && RUN_RE.test(mv.name)){ const k=mv.name; if(!best[k]||mv.time<best[k].time) best[k]={name:mv.name,time:mv.time,date:s.date}; } }));
  return Object.values(best).sort((a,b)=>a.time-b.time).slice(0,6);
}
function movementList(hist){
  const cnt={};
  hist.forEach(s=>{ const seen=new Set(); s.moves.forEach(mv=>{ if(seen.has(mv.name))return; seen.add(mv.name); if(mv.weight>0 || (mv.time>0&&RUN_RE.test(mv.name))) cnt[mv.name]=(cnt[mv.name]||0)+1; }); });
  return Object.entries(cnt).filter(([,n])=>n>=2).map(([name,n])=>({name,n})).sort((a,b)=>b.n-a.n).slice(0,24);
}
function movementSeries(hist, name){
  const run=RUN_RE.test(name); const pts=[];
  [...hist].reverse().forEach(s=>{ let v=0; s.moves.forEach(mv=>{ if(mv.name===name){ v = run ? (mv.time||v||0) : Math.max(v, mv.weight||0); } }); if(v>0) pts.push({date:s.date, value:v}); });
  return { pts, run };
}
function svgSeries(series){
  const {pts, run}=series;
  if(pts.length<2) return `<div class="pend" style="border:0"><em>Not enough data to trend yet</em> — ${pts.length} logged point${pts.length===1?'':'s'}.</div>`;
  const W=320,H=120,PL=8,PR=8,PT=10,PB=16;
  const ys=pts.map(p=>p.value), ymin=Math.min(...ys), ymax=Math.max(...ys), yr=(ymax-ymin)||1;
  const X=i=> PL + (i/(pts.length-1))*(W-PL-PR);
  const Y=v=> PT + (1-(v-ymin)/yr)*(H-PT-PB);
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.value).toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="2.1"/>`).join('');
  const first=pts[0], last=pts[pts.length-1];
  const fmt=v=> run? fmtTime(v) : v.toLocaleString();
  const improved = run ? last.value<=first.value : last.value>=first.value;
  const col = improved ? 'var(--good)' : 'var(--warn)';
  return `<svg viewBox="0 0 ${W} ${H}" class="spark" style="--c:${col}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--c)" stroke-width="2"/>${dots}<text x="${PL}" y="${H-3}" class="axl">${esc(first.date.slice(5))}</text><text x="${W-PR}" y="${H-3}" text-anchor="end" class="axl">${esc(last.date.slice(5))}</text></svg><div class="prange"><span>${fmt(ymin)} – ${fmt(ymax)}</span><span>${pts.length} sessions · ${run?'lower = faster':'higher = heavier'}</span></div>`;
}
function renderSession(s){
  if(!s) return '';
  return `<div class="dh2">${esc(s.date)}${s.title?' · '+esc(s.title):''}</div>` + s.moves.map(mv=>{ const r=[]; if(mv.reps)r.push(mv.reps+' reps'); if(mv.weight)r.push(mv.weight.toLocaleString()+' lb'); if(mv.time)r.push(fmtTime(mv.time)); return `<div class="splitrow"><span>${esc(mv.name)}</span><span class="vv">${esc(r.join(' · ')||'logged')}</span></div>`; }).join('');
}
function buildProfile(box, m){
  box.innerHTML=''; if(!m) return;
  const hist=(m.hist||[]).filter(s=>s&&s.moves);
  const stat=(l,v)=>`<div class="pstat"><div class="pl">${l}</div><div class="pv tnum">${v}</div></div>`;
  const strip=document.createElement('div'); strip.className='pstrip';
  strip.innerHTML = stat('Streak',(m.streak||0)+'d') + stat('Days trained',m.w) + stat('Sessions',hist.length) + (m.c?stat('Career',m.c):stat('Best streak','—'));
  box.appendChild(strip);
  if(!hist.length){ const p=document.createElement('div'); p.className='pend'; p.innerHTML='<em>No detailed history in this window yet.</em> It fills in as workouts are logged.'; box.appendChild(p); return; }

  const cols=document.createElement('div'); cols.className='pcols';
  const lifts=topLifts(hist), runs=fastRuns(hist);
  cols.innerHTML =
    `<div><div class="dh">Top lifts</div>${lifts.length?lifts.map(p=>`<div class="splitrow"><span>${esc(p.name)}</span><span class="vv">${p.weight.toLocaleString()} lb<small style="opacity:.55"> · ${esc(p.date)}</small></span></div>`).join(''):'<div class="pend" style="border:0"><em>No weighted lifts logged.</em></div>'}</div>`
  + `<div><div class="dh">Fastest runs</div>${runs.length?runs.map(p=>`<div class="splitrow"><span>${esc(p.name)}</span><span class="vv">${fmtTime(p.time)}<small style="opacity:.55"> · ${esc(p.date)}</small></span></div>`).join(''):'<div class="pend" style="border:0"><em>No timed runs logged.</em></div>'}</div>`;
  box.appendChild(cols);

  const moves=movementList(hist);
  if(moves.length){
    const wrap=document.createElement('div');
    const sel=document.createElement('select'); sel.className='psel';
    moves.forEach(mo=>{ const o=document.createElement('option'); o.value=mo.name; o.textContent=`${mo.name}  (${mo.n})`; sel.appendChild(o); });
    const chart=document.createElement('div'); chart.className='pchart';
    const draw=()=>{ chart.innerHTML=svgSeries(movementSeries(hist, sel.value)); };
    sel.addEventListener('change', draw);
    wrap.innerHTML='<div class="dh">Trend — pick a movement</div>'; wrap.appendChild(sel); wrap.appendChild(chart);
    box.appendChild(wrap); draw();
  }

  const wrapW=document.createElement('div');
  const selW=document.createElement('select'); selW.className='psel';
  hist.forEach((s,idx)=>{ const o=document.createElement('option'); o.value=idx; o.textContent=`${s.date}${s.title?' · '+s.title:''}`; selW.appendChild(o); });
  const day=document.createElement('div'); day.className='pday';
  const showDay=()=>{ day.innerHTML=renderSession(hist[+selW.value]); };
  selW.addEventListener('change', showDay);
  wrapW.innerHTML='<div class="dh">Previous workouts</div>'; wrapW.appendChild(selW); wrapW.appendChild(day);
  box.appendChild(wrapW); showDay();

  if(m.prs&&m.prs.length){ const pr=document.createElement('div'); pr.innerHTML='<div class="dh">Personal bests</div>'+m.prs.slice(0,6).map(p=>{ const v=p.weight?p.weight.toLocaleString()+' lb':p.reps+' reps'; return `<div class="splitrow"><span>🏆 ${esc(p.name)}</span><span class="vv">${esc(v)}<small style="opacity:.6"> · ${esc(p.date)}</small></span></div>`; }).join(''); box.appendChild(pr); }
}

if (only && ORDER.includes(only)) { swEl.hidden = true; show(only); } else { show('ATHENA'); }
</script></body></html>
